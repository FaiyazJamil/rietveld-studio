[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rietveld-studio"
version = "0.2.1"
description = "Guided, traceable powder X-ray Rietveld refinement with GSAS-II"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Md Faiyaz Jamil"}]
maintainers = [{name = "Md Faiyaz Jamil"}]
keywords = ["Rietveld", "powder diffraction", "XRD", "crystallography", "GSAS-II"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4",
  "pandas>=2.1,<4", "PySide6>=6.7,<7", "gemmi>=0.7,<0.8",
  "requests>=2.32,<3", "openpyxl>=3.1,<4", "platformdirs>=4,<5",
]

# BEGIN GENERATED PROJECT URLS
[project.urls]
Repository = "https://github.com/FaiyazJamil/rietveld-studio"
Issues = "https://github.com/FaiyazJamil/rietveld-studio/issues"
Documentation = "https://github.com/FaiyazJamil/rietveld-studio#readme"
# END GENERATED PROJECT URLS

[project.optional-dependencies]
origin = ["originpro>=1.1; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
release = ["cffconvert>=2.0,<3", "build>=1", "twine>=6,<7"]

[project.scripts]
rietveld-studio = "rietveld_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/rietveld-studio" = ["CITATION.cff", "CITATION.bib", "CITATION.md", "AUTHORS.md", "THIRD_PARTY_NOTICES.md", "PUBLISH_ON_GITHUB_ZENODO.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a working GSAS-II installation", "network: live COD checks"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

