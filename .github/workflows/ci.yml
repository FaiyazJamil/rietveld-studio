name: Package and citation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install development and release dependencies
        run: python -m pip install -e '.[dev,release]'
      - name: Check citation and Zenodo metadata
        run: |
          python scripts/prepare_release.py --check
          cffconvert --validate
      - name: Check Python source
        run: python -m ruff check src scripts tests
      - name: Run tests that do not need an installed GSAS-II engine
        run: python -m pytest -q -m 'not integration and not network'
      - name: Build source and wheel distributions
        run: |
          python -m build
          python -m twine check dist/*
